name: Deploy to GitHub Pages

on:
  push:
    branches:
      - miles
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 14

      - name: Install required dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install dependencies and build the project
        run: cd reactApp && export CI=false && PUBLIC_URL="https://mmmooe.github.io/To-do-list/" && rm -rf node_modules package-lock.json && npm install && npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reactApp/build  # Ensure this is the correct build output folder

  deploy:
    runs-on: ubuntu-latest
    needs: build  # Ensures build completes before deployment
      
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
